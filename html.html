<body>
    <div>
        <button onclick="alert('Hello')">pindutin mo para maalert ka (Inline JS)</button>
    </div>

   
    <div>
        <button onclick="sabihinHello()">pindutin mo para maalert ka (From Function)</button>
        <div class="output" id="output2"></div>
        <p class="note">From function</p>
    </div>

 
    <div>

    <div>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button onclick="greetUser()">Greet me</button>
        <p id="greeting"></p>

    <div id="light" style="background-color: gray;padding: 20px; text-align: center;border-radius: 5px;margin-bottom: 10px;">
        light is off

    </div>
        <button onclick="toggleLight()">Toggle Light</button>



    <script>
        function sabihinHello() {
            let message = "Hello galing sa Function";
            alert(message);
            document.getElementById("output2").innerHTML = message;
            console.log("Sample 2: Button was clicked");
        }

        function orasPo() {
            document.getElementById("demo3").innerHTML = "Text changed! Button pressed at "+new Date().toLocaleTimeString();
            console.log("Sample 3: Button was clicked");
        }

        let count = 0;
        function dagdag() {
            count++;
            document.getElementById("countDisplay").innerHTML = count;
            console.log("Sample 4");
        }

        function greetUser() {
            let name = document.getElementById("nameInput").value;
            
            if (name === "") {
                name = "Guest";
            }
            let message = "Hello, " + name + "!";
            
            document.getElementById("greeting").innerHTML = message;
            console.log("Sample 5");
        }

        let isLightOn=false
         function toggleLight(){
            isLightOn=!isLightOn;
            let light = document.getElementById("light"); // Corrected this line
            if(isLightOn){
                light.innerHTML="Light is ON";
                light.style.backgroundColor="red";
                light.style.color="black";
                console.log("Sample 8: Light turned ON")
            }else{
                light.innerHTML="Light is OFF";
                light.style.backgroundColor="gray";
                light.style.color="white";
                console.log("Sample 8: Light turned OFF")
            }




        }

    </script>
</body>
</html>
